# ============================================================
# 意图定义表（9 类 = 8 个业务类 + 1 个其他闲聊类）
# 业务意图对应一个知识库子目录，以及一组用于规则路由的关键词
# other_chitchat 无知识库（kb_dir 为空），走自由闲聊回答，不做检索
# ============================================================

intents:
  - name: policy_attendance
    desc: "考勤/上下班时间/打卡/请假/调休/加班/年假"
    kb_dir: policy
    keywords:
      - "上下班时间"
      - "几点上班"
      - "几点下班"
      - "打卡"
      - "考勤"
      - "请假"
      - "调休"
      - "加班"
      - "年假"

  - name: it_vpn
    desc: "VPN/网络/密码重置/设备领用/打印机"
    kb_dir: it
    keywords:
      - "vpn"
      - "VPN"
      - "密码"
      - "重置密码"
      - "连不上网"
      - "电脑"
      - "打印机"
      - "wifi"

  - name: finance_expense
    desc: "报销/发票/薪资/工资条/出差补助"
    kb_dir: finance
    keywords:
      - "报销"
      - "发票"
      - "工资"
      - "薪资"
      - "工资条"
      - "个税"
      - "出差补助"

  - name: hr_onboarding
    desc: "入职/离职/劳动合同/社保公积金/福利"
    kb_dir: hr
    keywords:
      - "入职"
      - "离职"
      - "社保"
      - "公积金"
      - "合同"
      - "体检"
      - "福利"

  - name: admin_logistics
    desc: "行政后勤/食堂/班车/宿舍/快递"
    kb_dir: admin
    keywords:
      - "食堂"
      - "班车"
      - "宿舍"
      - "快递"
      - "门禁"
      - "停车"
      - "工牌"
      - "饮用水"
      - "会议室"

  - name: engineering_eq
    desc: "工程设备/产线故障/设备报修/维修"
    kb_dir: engineering
    keywords:
      - "产线"
      - "设备"
      - "报修"
      - "维修"
      - "故障"
      - "停机"
      - "PLC"
      - "保养"
      - "备件"

  - name: legal_contract
    desc: "法务合同/保密协议/知识产权/诉讼"
    kb_dir: legal
    keywords:
      - "合同"
      - "保密协议"
      - "知识产权"
      - "专利"
      - "诉讼"
      - "法律"
      - "违约"
      - "公章"

  - name: sales_marketing
    desc: "销售市场/客户/报价/渠道/品牌"
    kb_dir: sales
    keywords:
      - "客户"
      - "报价"
      - "渠道"
      - "品牌"
      - "销售"
      - "订单"
      - "回款"
      - "展会"

  # 其他/闲聊：无知识库，不检索，由 LLM 自由友好回答
  - name: other_chitchat
    desc: "闲聊问候/与业务无关的其他问题"
    kb_dir: ""
    keywords:
      - "你好"
      - "您好"
      - "谢谢"
      - "再见"
      - "早上好"
      - "你是谁"

# 拒答意图（知识库不应回答的越权问题）
out_of_scope_keywords:
  - "CEO"
  - "财报"
  - "别人的"
  - "工资是多少"
